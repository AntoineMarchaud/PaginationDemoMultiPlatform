[versions]

android-compileSdk = "37"
android-minSdk = "29"
android-targetSdk = "37"

# Plugins
kotlin_version = "2.4.21"
android_gradle_plugin_version = "9.5.1"
kotlinxDatetime_version = "0.8.0"
ksp-plugin = "2.3.13"

#Koin
koin_version = "4.2.2"

# Compose
activity_compose_version = "1.13.0"
compose_multiplatform_plugin_version = "1.12.2"
navigationCompose_version = "2.10.0"
material3Android = "1.9.0"

# Others
room_version = "2.8.5"
sqlite_version = "2.7.1"
coil_version = "3.6.3"
ktor_version = "3.6.1"
paging_version = "3.5.3"
lifecycle_version = "2.11.0"

# Tests
kotlinxCoroutines_version = "1.11.0"
turbine_version = "1.2.1"

[plugins]
com-google-devtools-ksp = { id = "com.google.devtools.ksp", version.ref = "ksp-plugin" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "compose_multiplatform_plugin_version" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin_version" }
kotlin-multiplatform-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "android_gradle_plugin_version" }
com-android-application = { id = "com.android.application", version.ref = "android_gradle_plugin_version" }

#kotlin
org-jetbrains-kotlin-serializable = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin_version" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin_version" }

room-plugin = { id = "androidx.room", version.ref = "room_version" }

[libraries]
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "compose_multiplatform_plugin_version" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "compose_multiplatform_plugin_version" }
compose-resources = { module = "org.jetbrains.compose.components:components-resources", version.ref = "compose_multiplatform_plugin_version" }
compose-uiToolingPreview = { module = "org.jetbrains.compose.ui:ui-tooling-preview", version.ref = "compose_multiplatform_plugin_version" }
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "material3Android" }

koin-core = { module = "io.insert-koin:koin-core", version.ref = "koin_version" }
koin-android = { module = "io.insert-koin:koin-android", version.ref = "koin_version" }
koin-compose = { module = "io.insert-koin:koin-compose", version.ref = "koin_version" }
koin-compose-viewmodel = { module = "io.insert-koin:koin-compose-viewmodel", version.ref = "koin_version" }

#compose multi plateforme
navigation-compose-multipatform = { module = "org.jetbrains.androidx.navigation:navigation-compose", version.ref = "navigationCompose_version" }

# compose android
activity_compose = { module = "androidx.activity:activity-compose", version.ref = "activity_compose_version" }

paging-common = { module = "androidx.paging:paging-common", version.ref = "paging_version" }
paging-compose = { module = "androidx.paging:paging-compose", version.ref = "paging_version" }

kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinxDatetime_version" }

ktor_core = { module = "io.ktor:ktor-client-core", version.ref = "ktor_version" }
ktor_client_android = { module = "io.ktor:ktor-client-android", version.ref = "ktor_version" }
ktor_client_content = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor_version" }
ktor_client_serialization = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor_version" }
ktor-client-darwin = { module = "io.ktor:ktor-client-darwin", version.ref = "ktor_version" }

sqliteBundled = { module = "androidx.sqlite:sqlite-bundled", version.ref = "sqlite_version" }
roomRuntime = { module = "androidx.room:room-runtime", version.ref = "room_version" }
roomPaging = { module = "androidx.room:room-paging", version.ref = "room_version" }

coil = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil_version" }
coil-network-ktor = { module = "io.coil-kt.coil3:coil-network-ktor3", version.ref = "coil_version" }

# for KSP
roomCompiler = { module = "androidx.room:room-compiler", version.ref = "room_version" }

# for previews
ui-tooling = { module = "org.jetbrains.compose.ui:ui-tooling", version.ref = "compose_multiplatform_plugin_version" }

# lifecycle (ObserveAsEvents, collectAsStateWithLifecycle)
lifecycle-runtime-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle_version" }

# tests
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin_version" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinxCoroutines_version" }
turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine_version" }
ktor-client-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor_version" }
paging-testing = { module = "androidx.paging:paging-testing", version.ref = "paging_version" }
